appId: com.lycoapp
---
# Pixel-truth lane: drive the real debug build on an emulator and leave the
# screenshots to adb. Metro must be reachable on 8081 (adb reverse) because the
# debug APK carries no JS bundle.
#
# Assertions target real Text nodes (the tab labels), not the TextInput hint:
# Maestro's plain-string selector matching a placeholder is not guaranteed, and
# a hint-only assertion would fail the lane for the wrong reason.
- launchApp:
    appId: com.lycoapp
    clearState: true
- assertVisible: "聊天"
- assertVisible: "身边"
- tapOn: "身边"
- assertVisible: "地图占位"
