name: emu-probe

# Temporary, dispatch-only experiment. The facts probe showed macos-14 does have
# usable acceleration ("accel: 0 / Hypervisor.Framework OS X Version 14.8") but
# ships no system images, so the earlier "Timeout waiting for emulator to boot"
# may have been a missing-image problem, not a hypervisor one. This boots an AVD
# directly and keeps the emulator's own log either way.
# Delete this file once the answer is recorded in docs/MODULE_TASKS.md.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  boot:
    name: "boot an AVD on macos-14 and keep the log"
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: install an arm64 system image
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "system-images;android-34;google_apis;arm64-v8a" 2>&1 | tail -5
          find "$ANDROID_HOME/system-images" -maxdepth 3 -mindepth 3 -type d | sed "s|$ANDROID_HOME/||"
      - name: create the avd
        run: |
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n probe -k "system-images;android-34;google_apis;arm64-v8a" -d pixel_7 2>&1 | tail -3
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - name: boot it
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd probe -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -verbose > /tmp/emu.log 2>&1 &
          disown
          echo "emulator pid=$!"
          for i in $(seq 1 60); do
            sleep 10
            done=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$done" = "1" ]; then echo "BOOTED after $((i*10))s"; exit 0; fi
          done
          echo "STILL NOT BOOTED after 600s - emulator log tail:"
          tail -60 /tmp/emu.log
          "$ANDROID_HOME/platform-tools/adb" devices -l || true
          exit 1
      - name: keep the emulator log either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: /tmp/emu.log
          if-no-files-found: warn
      - name: grab the CI release apk (bundle embedded, so no metro needed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Only dispatch runs build the release variant, so walk recent successful
          # ci.yml runs until one actually carries the artifact.
          for rid in $(gh run list --workflow ci.yml --status success --limit 12 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$rid" -n lycoapp-release -D "$GITHUB_WORKSPACE/apk" 2>/dev/null; then
              echo "got lycoapp-release from run $rid"; break
            fi
          done
          ls -la "$GITHUB_WORKSPACE/apk"
      - name: drive the app and screenshot
        if: success()
        run: |
          set -e
          A="$ANDROID_HOME/platform-tools/adb"
          $A install -r "$GITHUB_WORKSPACE/apk/app-release.apk"
          $A shell am start -n com.lycoapp/.MainActivity
          sleep 15
          $A exec-out screencap -p > /tmp/01-chat.png
          $A shell uiautomator dump /sdcard/ui.xml >/dev/null
          $A pull /sdcard/ui.xml /tmp/ui-chat.xml >/dev/null
          grep -q "问 Lyco" /tmp/ui-chat.xml || { echo "chat input never rendered"; exit 1; }
          # tap the second tab button, read its real bounds out of the dump
          eval "$(python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          b = [n.get('bounds') for n in ET.parse('/tmp/ui-chat.xml').iter('node')
               if n.get('class').endswith('Button')]
          l, t, r, bo = (int(v) for v in re.findall(r'-?\d+', b[1]))
          print(f'TAP_X={(l + r) // 2} TAP_Y={(t + bo) // 2}')
          PY
          )"
          echo "tapping $TAP_X,$TAP_Y"
          $A shell input tap "$TAP_X" "$TAP_Y"
          sleep 4
          $A shell uiautomator dump /sdcard/ui2.xml >/dev/null
          $A pull /sdcard/ui2.xml /tmp/ui-map.xml >/dev/null
          grep -q "地图占位" /tmp/ui-map.xml || { echo "the tab tap did not switch screens"; exit 1; }
          $A exec-out screencap -p > /tmp/02-nearby.png
          ls -la /tmp/0*.png
          test $(stat -f %z /tmp/01-chat.png) -gt 20000
          test $(stat -f %z /tmp/02-nearby.png) -gt 20000
          if cmp -s /tmp/01-chat.png /tmp/02-nearby.png; then echo "identical shots"; exit 1; fi
      - name: upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: /tmp/0*.png
          if-no-files-found: error
