name: tcg probe 2 (throwaway)

# One question, never actually answered: can an AVD boot at all on a free
# GitHub-hosted Linux runner with acceleration off? The first probe died in
# setup twice (bad zip URL; then `grep | head` masking an avdmanager that
# created nothing). This one verifies the AVD exists before booting, falls back
# to writing config.ini by hand, and if it ever boots, installs the CI release
# APK and uploads real screenshots.
#
# Dispatch only. Delete once the answer is recorded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcg2:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: install the SDK pieces
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" \
            platform-tools emulator "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64" > /tmp/sdk.log 2>&1 \
            || { tail -30 /tmp/sdk.log; exit 1; }
          {
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/platform-tools"
            echo "$(dirname "$SDKM")"
          } >> "$GITHUB_PATH"

      - name: create the AVD and prove it exists
        run: |
          set -e
          avdmanager create avd --force -n tcg2 \
            -k "system-images;android-34;google_apis;x86_64" -d pixel_7 2>&1 | tail -5
          if ! emulator -list-avds | grep -qx tcg2; then
            echo "avdmanager did not create it; writing the AVD by hand"
            find "$HOME/.android" -maxdepth 3 2>/dev/null | head -20
            AVD_DIR="$HOME/.android/avd/tcg2.avd"
            mkdir -p "$AVD_DIR"
            printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/tcg2.avd\ntarget=android-34\n' \
              "$AVD_DIR" > "$HOME/.android/avd/tcg2.ini"
            cat > "$AVD_DIR/config.ini" <<CFG
          AvdId=tcg2
          PlayStore.enabled=false
          abi.type=x86_64
          hw.arch=x86_64
          hw.cpu.arch=x86_64
          hw.device.manufacturer=Google
          hw.device.name=pixel_7
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.ramSize=2048
          hw.sdCard=yes
          disk.dataPartition.size=6G
          image.sysdir.1=system-images/android-34/google_apis/x86_64/
          tag.display=Google APIs
          tag.id=google_apis
          target.id=android-34
          vm.heapSize=256
          CFG
          fi
          emulator -list-avds
          emulator -list-avds | grep -qx tcg2
          test -f "$HOME/.android/avd/tcg2.avd/config.ini"
          echo "--- runner acceleration reality ---"
          ls -l /dev/kvm || echo "NO /dev/kvm"
          emulator -accel-check || echo "accel-check exit=$?"

      - name: boot under TCG and time it
        run: |
          set -e
          emulator -avd tcg2 -no-window -no-audio -no-boot-anim -no-snapshot \
            -accel off -gpu swiftshader_indirect -verbose > /tmp/emu-tcg.log 2>&1 &
          EMPID=$!
          echo "emulator pid=$EMPID"
          : > /tmp/cpu-samples.txt
          for i in $(seq 1 80); do
            sleep 30
            st=$(adb get-state 2>/dev/null | tr -d '\r' || echo none)
            done=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo '')
            cpu=$(ps -o times= -C qemu-system-x86_64 2>/dev/null | awk '{s+=$1} END {print s+0}')
            lines=$(wc -l < /tmp/emu-tcg.log)
            echo "t=$((i*30))s state=$st boot=$done qemu_cpu=${cpu}s log_lines=$lines" | tee -a /tmp/cpu-samples.txt
            if [ "$done" = "1" ]; then echo "BOOTED under TCG after $((i*30))s"; exit 0; fi
            if ! kill -0 "$EMPID" 2>/dev/null; then echo "emulator process gone at $((i*30))s"; break; fi
          done
          echo "NOT BOOTED under TCG within the window"
          tail -40 /tmp/emu-tcg.log
          exit 1

      - name: if it booted, drive the app and take the shots
        if: success()
        run: |
          set -e
          adb wait-for-device
          adb shell input keyevent 82 || true
          echo "device is up; screenshots below are the point of this probe"

      - name: grab the CI release APK
        if: success()
        uses: actions/download-artifact@v4
        with:
          name: lycoapp-release
          path: apk
          run-id: 36819966796
          github-token: ${{ github.token }}

      - name: install, tap both screens, screencap
        if: success()
        run: |
          set -e
          adb install -r apk/app-release.apk
          adb shell am start -n com.lycoapp/.MainActivity
          sleep 25
          adb exec-out screencap -p > /tmp/tcg-chat.png
          adb shell uiautomator dump /sdcard/ui.xml >/dev/null
          adb pull /sdcard/ui.xml /tmp/ui-chat.xml >/dev/null
          grep -a -q "问 Lyco" /tmp/ui-chat.xml || echo "WARN: chat input not in dump"
          adb shell input tap 216 205
          sleep 6
          adb exec-out screencap -p > /tmp/tcg-nearby.png
          ls -l /tmp/tcg-*.png

      - name: upload whatever this probe produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcg2-evidence
          path: |
            /tmp/tcg-*.png
            /tmp/ui-chat.xml
            /tmp/emu-tcg.log
            /tmp/cpu-samples.txt
          if-no-files-found: warn
