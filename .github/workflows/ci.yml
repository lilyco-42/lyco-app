name: ci

# AGENTS.md rule 1: nothing gets compiled or built on the dev machine.
# Python/node tests and the Android build all run here instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_emulator:
        description: "Try the device job (only schedulable from a Team/Enterprise org)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  python:
    name: python core + services tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the only runtime dep
        run: pip install httpx
      - name: "core loop (offline: no model, no network)"
        run: python test_core_offline.py
      - name: services/poi
        run: python services/poi/test_poi.py
      - name: services/reviews
        run: python services/reviews/test_reviews.py

  mobile:
    name: typecheck + jest + sensors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - name: npm ci
        working-directory: mobile/app
        run: npm ci
      - name: tsc --noEmit
        working-directory: mobile/app
        run: npx tsc --noEmit
      - name: jest
        working-directory: mobile/app
        run: npx jest --ci
      - name: sensors permissions (node:test)
        run: node --test mobile/sensors/test_permissions.mjs

  plugin:
    name: "DSH plugin (dsh-lyco-chat)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LYCO_PY: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node 22 cannot import a .ts file; the plugin test does
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/dsh-lyco-chat/package-lock.json
      - name: npm ci
        working-directory: plugins/dsh-lyco-chat
        run: npm ci
      - name: plugin tests
        working-directory: plugins/dsh-lyco-chat
        run: node --test test_plugin.mjs

  preview:
    name: "storybook preview (react-native-web)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - name: npm ci
        working-directory: mobile/app
        run: npm ci
      - name: storybook build
        working-directory: mobile/app
        run: npm run storybook:build
      - name: the preview must actually contain the screens
        working-directory: mobile/app
        run: |
          node -e "
          const j = require('./storybook-static/index.json');
          const ids = Object.keys(j.entries).filter(k => j.entries[k].type === 'story');
          console.log('stories:', ids.join(' '));
          if (ids.length < 3) throw new Error('expected >=3 stories, got ' + ids.length);
          for (const need of ['app-root--chat-tab','screens--chat','screens--nearby']) {
            if (!ids.includes(need)) throw new Error('missing story ' + need);
          }"
      - name: upload preview
        uses: actions/upload-artifact@v4
        with:
          name: storybook-preview
          path: mobile/app/storybook-static
          if-no-files-found: error

  android:
    name: debug APK (gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [python, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: npm ci
        working-directory: mobile/app
        run: npm ci
      - name: gradlew lost its exec bit when the tree was committed from Windows
        run: chmod +x mobile/app/android/gradlew
      - name: assembleDebug
        working-directory: mobile/app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: lycoapp-debug
          path: mobile/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # A debug APK carries no JS bundle at all (the gradle plugin only creates
      # the bundle task for non-debuggable variants), so installing it is useless
      # unless Metro is reachable. Release embeds the bundle, so this is the APK
      # to hand to a phone or an emulator with no dev server.
      - name: assembleRelease (bundle embedded)
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile/app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: the release apk must really carry the bundle
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import zipfile
          p = "mobile/app/android/app/build/outputs/apk/release/app-release.apk"
          names = zipfile.ZipFile(p).namelist()
          assert "assets/index.android.bundle" in names, [n for n in names if n.startswith("assets/")] or names[:20]
          info = zipfile.ZipFile(p).getinfo("assets/index.android.bundle")
          print("index.android.bundle:", info.file_size, "bytes uncompressed")
          assert info.file_size > 100_000, info.file_size
          PY
      - name: upload release apk
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lycoapp-release
          path: mobile/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  device:
    name: "emulator screenshots (pixel truth)"
    # NOT RUNNABLE ON THIS ACCOUNT - kept as the route for a future org move.
    # Measured, not guessed:
    #   * ubuntu-latest: "You're running a Linux VM where hardware acceleration
    #     is not available" - no /dev/kvm, so an x86_64 AVD never boots.
    #   * macos-14 (standard, free for public repos): `emulator -accel-check`
    #     exits 0 claiming Hypervisor.Framework, but a real boot dies at once
    #     with "HVF error: HV_UNSUPPORTED" / "failed to initialize HVF: Invalid
    #     argument" - the runner is itself a VM (VirtualMac2,1) with no nested
    #     virtualisation, so -accel-check is a false positive there.
    #   * the action's own recommendation is what is configured below: a Linux
    #     *larger* runner plus the KVM udev rule. GitHub's docs restrict larger
    #     runners to "organizations and enterprises using the GitHub Team or
    #     GitHub Enterprise Cloud plans", and this repo belongs to a personal
    #     account, so no payment method makes it schedulable.
    # Until then the pixel truth comes from scripts/device_ui_check.py against a
    # local emulator.
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 45
    # Opt-in even for a dispatch: with no matching runner on this account the job
    # would just sit "Waiting for a runner" until the queue timeout.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_emulator == 'true'
    needs: [android]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          # The release build embeds assets/index.android.bundle, so the emulator
          # needs no Metro server and no node install.
          name: lycoapp-release
          path: apk
      - name: drive the real app on an emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -e
            adb install -r "$GITHUB_WORKSPACE/apk/app-release.apk"
            adb shell am start -n com.lycoapp/.MainActivity
            sleep 20
            adb exec-out screencap -p > /tmp/01-chat.png
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml /tmp/ui-chat.xml >/dev/null
            grep -q "问 Lyco" /tmp/ui-chat.xml || { echo "chat input never rendered"; exit 1; }
            # The tab row is the second clickable Button in the top band.
            eval "$(python3 - <<'PY'
            import re, xml.etree.ElementTree as ET
            b = [n.get('bounds') for n in ET.parse('/tmp/ui-chat.xml').iter('node')
                 if n.get('class').endswith('Button')]
            l, t, r, bo = (int(v) for v in re.findall(r'-?\d+', b[1]))
            print(f'TAP_X={(l + r) // 2} TAP_Y={(t + bo) // 2}')
            PY
            )"
            adb shell input tap "$TAP_X" "$TAP_Y"
            sleep 4
            adb shell uiautomator dump /sdcard/ui2.xml >/dev/null
            adb pull /sdcard/ui2.xml /tmp/ui-map.xml >/dev/null
            grep -q "地图占位" /tmp/ui-map.xml || { echo "the tab tap did not switch screens"; exit 1; }
            adb exec-out screencap -p > /tmp/02-nearby.png
      - name: the shots must be real and must differ
        run: |
          ls -la /tmp/01-chat.png /tmp/02-nearby.png
          test $(stat -c %s /tmp/01-chat.png) -gt 20000
          test $(stat -c %s /tmp/02-nearby.png) -gt 20000
          if cmp -s /tmp/01-chat.png /tmp/02-nearby.png; then
            echo "identical screenshots: the tap on 身边 did nothing"
            exit 1
          fi
          echo "screenshots differ, sizes: $(stat -c %s /tmp/01-chat.png) / $(stat -c %s /tmp/02-nearby.png)"
      - name: upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: /tmp/0*.png
          if-no-files-found: error
