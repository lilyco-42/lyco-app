name: ci

# AGENTS.md rule 1: nothing gets compiled or built on the dev machine.
# Python/node tests and the Android build all run here instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_emulator:
        description: "Try the device job (only schedulable from a Team/Enterprise org)"
        type: boolean
        required: false
        default: false
      dry_run_device:
        description: "Run the device job's non-emulator steps on a standard runner"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  python:
    name: python core + services tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the only runtime dep
        run: pip install httpx
      - name: "core loop (offline: no model, no network)"
        run: python test_core_offline.py
      - name: services/poi
        run: python services/poi/test_poi.py
      - name: services/reviews
        run: python services/reviews/test_reviews.py

  mobile:
    name: typecheck + jest + sensors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - name: npm ci
        working-directory: mobile/app
        run: npm ci
      - name: tsc --noEmit
        working-directory: mobile/app
        run: npx tsc --noEmit
      - name: jest
        working-directory: mobile/app
        run: npx jest --ci
      - name: sensors permissions (node:test)
        run: node --test mobile/sensors/test_permissions.mjs

  plugin:
    name: "DSH plugin (dsh-lyco-chat)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LYCO_PY: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node 22 cannot import a .ts file; the plugin test does
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/dsh-lyco-chat/package-lock.json
      - name: npm ci
        working-directory: plugins/dsh-lyco-chat
        run: npm ci
      - name: plugin tests
        working-directory: plugins/dsh-lyco-chat
        run: node --test test_plugin.mjs

  preview:
    name: "storybook preview (react-native-web)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - name: npm ci
        working-directory: mobile/app
        run: npm ci
      - name: storybook build
        working-directory: mobile/app
        run: npm run storybook:build
      - name: the preview must actually contain the screens
        working-directory: mobile/app
        run: |
          node -e "
          const j = require('./storybook-static/index.json');
          const ids = Object.keys(j.entries).filter(k => j.entries[k].type === 'story');
          console.log('stories:', ids.join(' '));
          if (ids.length < 3) throw new Error('expected >=3 stories, got ' + ids.length);
          for (const need of ['app-root--chat-tab','screens--chat','screens--nearby']) {
            if (!ids.includes(need)) throw new Error('missing story ' + need);
          }"
      - name: upload preview
        uses: actions/upload-artifact@v4
        with:
          name: storybook-preview
          path: mobile/app/storybook-static
          if-no-files-found: error

  android:
    name: debug APK (gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [python, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: npm ci
        working-directory: mobile/app
        run: npm ci
      - name: gradlew lost its exec bit when the tree was committed from Windows
        run: chmod +x mobile/app/android/gradlew
      - name: assembleDebug
        working-directory: mobile/app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: lycoapp-debug
          path: mobile/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # A debug APK carries no JS bundle at all (the gradle plugin only creates
      # the bundle task for non-debuggable variants), so installing it is useless
      # unless Metro is reachable. Release embeds the bundle, so this is the APK
      # to hand to a phone or an emulator with no dev server.
      - name: assembleRelease (bundle embedded)
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile/app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: the release apk must really carry the bundle
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import zipfile
          p = "mobile/app/android/app/build/outputs/apk/release/app-release.apk"
          names = zipfile.ZipFile(p).namelist()
          assert "assets/index.android.bundle" in names, [n for n in names if n.startswith("assets/")] or names[:20]
          info = zipfile.ZipFile(p).getinfo("assets/index.android.bundle")
          print("index.android.bundle:", info.file_size, "bytes uncompressed")
          assert info.file_size > 100_000, info.file_size
          PY
      - name: upload release apk
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lycoapp-release
          path: mobile/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  device:
    name: "emulator screenshots (pixel truth)"
    # Measured on ubuntu-latest, 2026-10-02: an AVD cold-boots under qemu TCG with
    # no /dev/kvm in 720s, and qemu CPU time tracked wall time the whole way - it
    # is slow, not stalled. So a free hosted runner can produce Android pixels.
    # ReactiveCircus/android-emulator-runner refuses to start without KVM on Linux,
    # which is the only reason this job boots the emulator itself instead of using
    # the action the original plan named.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [android]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_emulator == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: install the SDK pieces
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" \
            platform-tools emulator "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64" > /tmp/sdk.log 2>&1 \
            || { tail -30 /tmp/sdk.log; exit 1; }
          {
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/platform-tools"
            echo "$(dirname "$SDKM")"
          } >> "$GITHUB_PATH"

      - name: build the AVD and prove it exists
        # avdmanager exits 0 on this runner without creating anything, so the
        # AVD is verified and, if missing, written by hand - the same fallback
        # the throwaway probe needed before it ever reached a boot.
        # hash2 is what makes the emulator load the pixel_7 device profile -
        # name+manufacturer alone leaves it without a navigation bar.
        # The lcd keys are not optional: without them the hand-written AVD boots
        # at a 320px-wide default display, which reports a 320-wide status bar
        # inset and no navigationBars source at all.
        run: |
          set -e
          avdmanager create avd --force -n lyco \
            -k "system-images;android-34;google_apis;x86_64" -d pixel_7 2>&1 | tail -5
          if ! emulator -list-avds | grep -qx lyco; then
            echo "avdmanager did not create it; writing the AVD by hand"
            find "$HOME/.android" -maxdepth 3 2>/dev/null | head -20
            AVD_DIR="$HOME/.android/avd/lyco.avd"
            mkdir -p "$AVD_DIR"
            printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/lyco.avd\ntarget=android-34\n' \
              "$AVD_DIR" > "$HOME/.android/avd/lyco.ini"
            cat > "$AVD_DIR/config.ini" <<CFG
          AvdId=lyco
          PlayStore.enabled=false
          abi.type=x86_64
          hw.arch=x86_64
          hw.cpu.arch=x86_64
          hw.device.manufacturer=Google
          hw.device.name=pixel_7
          hw.device.hash2=MD5:2016577e1656e8e7c2adb0fac972beea
          hw.lcd.width=1080
          hw.lcd.height=2400
          hw.lcd.density=420
          hw.lcd.depth=32
          hw.lcd.backlight=yes
          hw.lcd.vsync=60
          hw.screen=multi-touch
          hw.cpu.ncore=4
          hw.ramSize=2G
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.ramSize=2048
          hw.sdCard=yes
          disk.dataPartition.size=6G
          image.sysdir.1=system-images/android-34/google_apis/x86_64/
          tag.display=Google APIs
          tag.id=google_apis
          target.id=android-34
          vm.heapSize=256
          CFG
          fi
          emulator -list-avds
          emulator -list-avds | grep -qx lyco
          test -f "$HOME/.android/avd/lyco.avd/config.ini"
          echo "--- runner acceleration reality ---"
          ls -l /dev/kvm || echo "NO /dev/kvm"
          emulator -accel-check || echo "accel-check exit=$?"

      - name: boot it without acceleration
        run: |
          set -e
          emulator -avd lyco -no-window -no-audio -no-boot-anim -no-snapshot \
            -accel off -gpu swiftshader_indirect > /tmp/emu.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 30
            done=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$done" = "1" ]; then echo "BOOTED under TCG after $((i*30))s"; exit 0; fi
          done
          echo "not booted within 1800s"
          tail -30 /tmp/emu.log
          exit 1

      - name: fetch the release APK (bundle embedded, so no Metro needed)
        uses: actions/download-artifact@v4
        with:
          name: lycoapp-release
          path: apk

      - name: drive both screens and assert the layout
        env:
          LYCO_DEVICE_SLOWDOWN: '8'
        run: |
          set -e
          # This AVD reports no navigationBars inset at all while it is in gesture
          # mode, which left the gate with nothing to compare the composer against.
          # Three-button nav gives the device a real band, so the bottom-edge check
          # means something here too.
          adb shell cmd overlay enable com.android.internal.systemui.navbar.threebutton             || echo "WARN: could not switch to 3-button navigation"
          sleep 20
          python3 scripts/device_ui_check.py \
            "$GITHUB_WORKSPACE/apk/app-release.apk" /tmp/device-ui

      - name: upload the shots and the widget dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: /tmp/device-ui/
          if-no-files-found: error

      - name: keep the window-manager state when it fails
        if: failure()
        run: adb shell dumpsys window > /tmp/dumpsys-window.txt 2>&1 || true
      - name: keep the emulator log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: |
            /tmp/emu.log
            /tmp/dumpsys-window.txt
          if-no-files-found: warn

  device-dry:
    name: "device job preflight (no emulator)"
    # The device job cannot be scheduled on this account (see the comment above
    # it), but everything in it except the KVM boot can. Running those parts on
    # a standard runner is what makes "the job is ready to use" a measured claim
    # instead of an assertion about untested YAML.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [android]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run_device == 'true'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: fetch the release APK the device job would install
        uses: actions/download-artifact@v4
        with:
          name: lycoapp-release
          path: apk

      - name: it must really be the file the device job points at
        run: |
          set -e
          ls -l apk
          test -f apk/app-release.apk

      - name: the bundle must really be inside it
        run: |
          python3 - <<'PY'
          import zipfile
          info = zipfile.ZipFile('apk/app-release.apk').getinfo('assets/index.android.bundle')
          print('bundle bytes:', info.file_size)
          assert info.file_size > 100_000, 'the release APK lost its bundle'
          PY

      - name: the gate script must run here and must refuse without a device
        run: |
          set -e
          # platform-tools ships on the runner but is not on PATH by default;
          # inside android-emulator-runner it is, so mirror that here.
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          python3 -c "import ast; ast.parse(open('scripts/device_ui_check.py').read()); print('parses under python3')"
          adb version
          set +e
          out=$(python3 scripts/device_ui_check.py apk/app-release.apk /tmp/dry 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -ne 0
          printf '%s' "$out" | grep -q "no emulator in state"
          echo "refused cleanly with no device attached, as intended"
          set +e
          stripped=$(PATH=/usr/bin:/bin python3 scripts/device_ui_check.py apk/app-release.apk /tmp/dry 2>&1)
          rc2=$?
          set -e
          test "$rc2" -ne 0
          printf '%s' "$stripped" | grep -q "adb is not on PATH"
          echo "and named the real cause when adb itself was missing"
