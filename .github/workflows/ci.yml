name: ci

# AGENTS.md rule 1: nothing gets compiled or built on the dev machine.
# Python/node tests and the Android build all run here instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python core + services tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the only runtime dep
        run: pip install httpx
      - name: "core loop (offline: no model, no network)"
        run: python test_core_offline.py
      - name: services/poi
        run: python services/poi/test_poi.py
      - name: services/reviews
        run: python services/reviews/test_reviews.py

  mobile:
    name: typecheck + jest + sensors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - name: npm ci
        working-directory: mobile/app
        run: npm ci
      - name: tsc --noEmit
        working-directory: mobile/app
        run: npx tsc --noEmit
      - name: jest
        working-directory: mobile/app
        run: npx jest --ci
      - name: sensors permissions (node:test)
        run: node --test mobile/sensors/test_permissions.mjs

  plugin:
    name: "DSH plugin (dsh-lyco-chat)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LYCO_PY: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node 22 cannot import a .ts file; the plugin test does
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/dsh-lyco-chat/package-lock.json
      - name: npm ci
        working-directory: plugins/dsh-lyco-chat
        run: npm ci
      - name: plugin tests
        working-directory: plugins/dsh-lyco-chat
        run: node --test test_plugin.mjs

  preview:
    name: "storybook preview (react-native-web)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - name: npm ci
        working-directory: mobile/app
        run: npm ci
      - name: storybook build
        working-directory: mobile/app
        run: npm run storybook:build
      - name: the preview must actually contain the screens
        working-directory: mobile/app
        run: |
          node -e "
          const j = require('./storybook-static/index.json');
          const ids = Object.keys(j.entries).filter(k => j.entries[k].type === 'story');
          console.log('stories:', ids.join(' '));
          if (ids.length < 3) throw new Error('expected >=3 stories, got ' + ids.length);
          for (const need of ['app-root--chat-tab','screens--chat','screens--nearby']) {
            if (!ids.includes(need)) throw new Error('missing story ' + need);
          }"
      - name: upload preview
        uses: actions/upload-artifact@v4
        with:
          name: storybook-preview
          path: mobile/app/storybook-static
          if-no-files-found: error

  android:
    name: debug APK (gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [python, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: npm ci
        working-directory: mobile/app
        run: npm ci
      - name: gradlew lost its exec bit when the tree was committed from Windows
        run: chmod +x mobile/app/android/gradlew
      - name: assembleDebug
        working-directory: mobile/app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: lycoapp-debug
          path: mobile/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  device:
    name: "emulator screenshots (pixel truth)"
    # GitHub's Linux runners give this job no /dev/kvm, so an x86_64 AVD has to
    # software-emulate and never boots inside the timeout. Apple Silicon runners
    # run the arm64 image on real CPU emulation-free hardware.
    runs-on: macos-14
    timeout-minutes: 45
    # Expensive lane (macOS minutes are metered at a multiplier), so it is
    # on-demand; `preview` is the every-push design-time lane.
    if: github.event_name == 'workflow_dispatch'
    needs: [android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: npm ci
        working-directory: mobile/app
        run: npm ci
      - name: install maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev -o /tmp/maestro-install.sh
          bash /tmp/maestro-install.sh -p "$HOME/.maestro"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: lycoapp-debug
          path: apk
      - name: start metro
        working-directory: mobile/app
        run: |
          nohup npx react-native start > /tmp/metro.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8081/status >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8081/status || { tail -40 /tmp/metro.log; exit 1; }
      - name: drive the real app on an emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          # arm64-v8a system images exist only for a few API levels (the action's
          # README names 30), and the app's minSdk is 24, so 30 is the safe pick.
          api-level: 30
          # The action's own vocabulary, not the SDK image folder name: it
          # rejects aarch64 with "Value for input.arch 'aarch64' is unknown.
          # Supported options: x86,x86_64,arm64-v8a".
          arch: arm64-v8a
          target: google_apis
          disable-animations: true
          script: |
            set -e
            adb install -r "$GITHUB_WORKSPACE/apk/app-debug.apk"
            adb reverse tcp:8081 tcp:8081
            adb shell am start -n com.lycoapp/.MainActivity
            sleep 60
            adb exec-out screencap -p > /tmp/01-chat.png
            maestro test "$GITHUB_WORKSPACE/.maestro/preview.yaml"
            sleep 5
            adb exec-out screencap -p > /tmp/02-nearby.png
      - name: the shots must be real and must differ
        run: |
          ls -la /tmp/01-chat.png /tmp/02-nearby.png
          test $(stat -c %s /tmp/01-chat.png) -gt 20000
          test $(stat -c %s /tmp/02-nearby.png) -gt 20000
          if cmp -s /tmp/01-chat.png /tmp/02-nearby.png; then
            echo "identical screenshots: the tap on 身边 did nothing"
            exit 1
          fi
          echo "screenshots differ, sizes: $(stat -c %s /tmp/01-chat.png) / $(stat -c %s /tmp/02-nearby.png)"
      - name: upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: /tmp/0*.png
          if-no-files-found: error
